name: whisper-box

x-runtime: &runtime
  image: whisper-box:local
  pull_policy: never
  init: true
  network_mode: none
  cpus: 0.5
  mem_limit: 256m
  pids_limit: 128
  environment: &environment
    HF_HUB_OFFLINE: "1"
    WHISPER_BOX_STATE: /state
    WHISPER_BOX_INPUT: /input
    WHISPER_BOX_OUTPUT: /output
    WHISPER_BOX_MODELS: /models
    WHISPER_BOX_HOST_ROOT: ${WHISPER_BOX_HOST_ROOT:-}
  volumes: &storage
    - state:/state
    - ./entrada:/input
    - ./saida:/output
    - ./modelos:/models:ro
  logging:
    driver: json-file
    options:
      max-size: 5m
      max-file: "2"

services:
  # Painel de gravacao (A02/F3): API local + pagina estatica (biblioteca padrao).
  # Unico servico com rede (bridge propria) e porta publicada, somente em loopback.
  # Recebe a gravacao em entrada/.gravacoes e a envia ao worker pela fila (state);
  # le saida/ e modelos/ somente leitura. O worker segue com network_mode: none.
  # Roda como root (donos de state/entrada sao root) sem nenhuma capability.
  painel:
    image: whisper-box:local
    pull_policy: never
    init: true
    command: [painel]
    networks: [painel]
    ports:
      - "127.0.0.1:${WHISPER_BOX_PAINEL_PORT:-8765}:8765"
    environment:
      <<: *environment
      WHISPER_BOX_PAINEL_PORT: ${WHISPER_BOX_PAINEL_PORT:-8765}
      WHISPER_BOX_STAGING_DAYS: ${WHISPER_BOX_STAGING_DAYS:-7}
      WHISPER_BOX_DISK_WARN_GIB: ${WHISPER_BOX_DISK_WARN_GIB:-5}
    volumes:
      - state:/state
      - ./entrada:/input
      - ./saida:/output:ro
      - ./modelos:/models:ro
      - ./painel:/srv/painel:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    healthcheck:
      test: [CMD, python, -c, "import os, urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8765/api/saude', headers={'Host': '127.0.0.1:' + os.environ['WHISPER_BOX_PAINEL_PORT']}), timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3

  worker:
    <<: *runtime
    build: .
    command: [worker]
    environment:
      <<: *environment
      # A04: delete (padrao, decisao D1) apaga entrada/<job_id>/ apos sucesso verificado; keep ou <N>d.
      WHISPER_BOX_INPUT_RETENTION: ${WHISPER_BOX_INPUT_RETENTION:-delete}
    cpus: 2
    mem_limit: 4g
    memswap_limit: 4g
    stop_grace_period: 20s
    restart: "on-failure:3"
    healthcheck:
      test: [CMD, python, -m, whisper_box, health]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3

  cli:
    <<: *runtime
    profiles: [tools]
    command: [--help]

  prepare:
    <<: *runtime
    profiles: [setup]
    network_mode: bridge
    cpus: 1
    mem_limit: 1g
    environment:
      <<: *environment
      HF_HUB_OFFLINE: "0"
    volumes:
      - ./modelos:/models
    command: [prepare]

  test:
    <<: *runtime
    profiles: [test]
    cpus: 2
    mem_limit: 1g
    volumes: []
    entrypoint: [python, -m, unittest, discover, -s, tests, -v]

networks:
  painel:

volumes:
  state:
